model:
  atom_feature_dim: 64
  edge_feature_dim: 64
  num_interaction_blocks: 3
  num_radial: 9
  num_angular: 9
  radial_cutoff: 5.0
  angle_cutoff: 4.0
  cutoff_coeff: 5
  max_atomic_number: 94
  num_readout_layers: 3
  readout_atom_norm: true
  interaction_dropout: 0.0
  atom_attention:
    enabled: true
    num_heads: 4
    dropout: 0.0
    use_ffn: false
    ffn_hidden_dim: null

element_references:
  source: data/MatPES-PBE-element-refs.json

optimizer:
  name: AdamW
  learning_rate: 7e-4
  weight_decay: 1e-4
  scheduler: CosLR
  scheduler_params:
    decay_fraction: 0.01
    warmup_epochs: 6
    warmup_start_factor: 0.1

training:
  epochs: 200
  batch_size: 128
  num_workers: 8
  persistent_workers: false
  device: cuda
  amp: false
  output_dir: runs
  grad_clip_norm: 10.0
  seed: 42
  deterministic: true
  distributed: auto

loss:
  energy_loss_weight: 1.0
  force_loss_weight: 10.0
  stress_loss_weight: 0.1

logging:
  wandb:
    enabled: true
    project: gptff-matpes-pbe
    entity: null
    name: MatPES-PBE-2025.2
    group: null
    tags:
      - MatPES-PBE
      - gptff
    notes: null
    mode: offline
    job_type: train

data:
  dataset_path: data/MatPES-PBE-2025.2.gptff.json
  validation_fraction: 0.05
  test_fraction: 0.05
  split_seed: 42
  group_by_material: false
  cache_graphs: false
  graph_cache_size: null
