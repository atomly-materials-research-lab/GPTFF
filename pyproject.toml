[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gptff"
version = "0.1.0"
description = "Graph-based Pretrained Transformer Force Field."
readme = "README.md"
authors = [
    { name = "Fankai Xie", email = "fankaixiee@gmail.com" },
    { name = "Tenglong Lu", email = "lutenglongg@gmail.com" },
]
maintainers = [{ name = "Tenglong Lu", email = "lutenglongg@gmail.com" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pymatgen>=2026.5.4",
    "ase>=3.28.0",
    "torch>=2.6.0",
    "tqdm>=4.68.2",
    "h5py>=3.16.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.15.20", "pytest>=9.1.1"]
wandb = ["wandb>=0.27.2"]

[tool.setuptools.packages]
find = { include = ["gptff*"], exclude = ["test*"] }

[tool.setuptools.package-data]
"gptff.assets" = ["MatPES-PBE-2025.2/*.pt"]

[project.scripts]
gptff = "gptff.cli:main"

[project.urls]
Homepage = "https://github.com/atomly-materials-research-lab/GPTFF"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["learn"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
