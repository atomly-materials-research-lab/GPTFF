[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GPTFF"
version = "0.0.1"
description = "Graph-based Pretrained Transformer Force Field."
authors = [
    { name = "Fankai Xie", email = "fankaixiee@gmail.com" },
    { name = "Tenglong Lu", email = "lutenglongg@gmail.com" },
]
maintainers = [{ name = "Tenglong Lu", email = "lutenglongg@gmail.com" }]
requires-python = ">=3.10"

dependencies = [
    "pymatgen>=2026.5.4",
    "ase>=3.28.0",
    "torch>=2.6.0",
    "tqdm>=4.68.2",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.27.2"]

[tool.setuptools.packages]
find = { include = ["gptff*"], exclude = ["test*"] }

[project.scripts]
gptff = "gptff.cli:main"

[project.urls]
Homepage = "https://github.com/atomly-materials-research-lab/GPTFF"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["learn"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
