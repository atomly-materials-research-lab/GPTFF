model:
  atom_feature_dim: 64
  edge_feature_dim: 64
  num_interaction_blocks: 3
  num_radial: 9
  num_angular: 4
  radial_cutoff: 5.0
  angle_cutoff: 3.5
  cutoff_coeff: 5
  max_atomic_number: 94
  num_readout_layers: 3
  readout_atom_norm: true
  interaction_dropout: 0.0

element_references:
  source: atomly
  ridge: 0.0

optimizer:
  name: AdamW
  learning_rate: 0.001
  weight_decay: 0.01
  scheduler: CosLR
  scheduler_params:
    decay_fraction: 0.01

training:
  epochs: 100
  batch_size: 128
  num_workers: 20
  device: cuda
  amp: false
  output_dir: .
  transformer_activate: false
  grad_clip_norm: 10.0
  seed: 42
  deterministic: true

loss:
  energy_loss_weight: 1.0
  force_loss_weight: 1.0
  stress_loss_weight: 0.1

data:
  dataset_path: path/to/dataset.json
  validation_fraction: 0.1
  test_fraction: 0.1
  split_seed: 42
  group_by_material: false
  cache_graphs: false
  graph_cache_size: null
