name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf build dist gptff.egg-info
          python -m build --wheel

      - name: Install wheel and test tools
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[dev]"

      - name: Smoke-test installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          gptff --help
          gptff --version

      - name: Run tests against installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import gptff

          package_path = Path(gptff.__file__).resolve()
          source_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if package_path.is_relative_to(source_root):
              raise RuntimeError(f"Tests imported GPTFF from the source tree: {package_path}")
          print(f"Testing installed package: {package_path}")
          PY
          python -m pytest -q --import-mode=importlib "${GITHUB_WORKSPACE}/tests"

      - name: Run Ruff
        run: ruff check .
